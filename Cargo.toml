[package]
name = "git-signet"
version = "0.4.0"
edition = "2024"
description = "Self-certifying BLINCS signet IDs and BLAKE3 tree/history binding for Git (pre-1.0 experimental)"
repository = "https://github.com/jasonhadler25/git-signet"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt
readme = "README.md"

[[bin]]
name = "git-signet"
path = "src/main.rs"

[dependencies]
blake3-servil-core = "=0.11.0"
signet = { git = "https://github.com/jasonhadler25/blincs", rev = "9c674f10d2d7b9c8b16161cbfad3a217fa4c9a7b" }

[profile.test]
opt-level = 3
codegen-units = 16
incremental = false
debug = false
debug-assertions = true
overflow-checks = true

[profile.mutants]
inherits = "release"
incremental = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_patterns = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
